<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Say No</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 50%, #e0f7fa 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .emoji {
      font-size: 5rem;
      margin-bottom: 0.5rem;
      transition: transform 0.3s ease;
    }

    /* Default: happy, bouncy wave */
    .emoji.happy {
      animation: bounce 1.5s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-12px) rotate(6deg); }
      60% { transform: translateY(-4px) rotate(-4deg); }
    }

    /* Thinking: slow rock + shrink */
    .emoji.thinking {
      animation: think 1.2s ease-in-out infinite;
    }

    @keyframes think {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(10deg) scale(0.95); }
      50% { transform: rotate(-5deg) scale(1.02); }
      75% { transform: rotate(8deg) scale(0.97); }
    }

    h1 {
      font-size: 1.5rem;
      color: #546e7a;
      font-weight: 400;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
    }

    .btn-no {
      background: linear-gradient(135deg, #ff1744, #d500f9, #651fff);
      color: #fff;
      border: none;
      width: 140px;
      height: 140px;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(213, 0, 249, 0.45), 0 0 60px rgba(255, 23, 68, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      letter-spacing: 0.04em;
    }

    .btn-no:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 40px rgba(213, 0, 249, 0.55), 0 0 80px rgba(255, 23, 68, 0.3);
    }

    .btn-no:active {
      transform: scale(0.95);
      box-shadow: 0 4px 16px rgba(213, 0, 249, 0.35);
    }

    .btn-no:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .history {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 50vh;
      overflow-y: auto;
      padding: 0 0.25rem;
    }

    .history::-webkit-scrollbar {
      width: 4px;
    }
    .history::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 2px;
    }

    .excuse-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      text-align: left;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      opacity: 0;
      transform: translateY(12px) scale(0.97);
      animation: cardIn 0.4s ease forwards;
      position: relative;
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .excuse-card .reason {
      font-size: 1.05rem;
      line-height: 1.6;
      font-style: italic;
      color: #546e7a;
      font-weight: 500;
      margin-right: 2rem;
    }

    .excuse-card .copy-btn {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.15s;
      padding: 0.2rem;
    }

    .excuse-card .copy-btn:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .excuse-card.error .reason {
      color: #e57373;
      font-style: normal;
    }

    .counter {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: #90a4ae;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .counter.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji happy" id="emoji">🤗</div>
    <h1>Need an excuse? We got you.</h1>

    <button class="btn-no" id="sayNoBtn">Say No</button>

    <div class="counter" id="counter"></div>
    <div class="history" id="history"></div>
  </div>

  <script>
    const btn = document.getElementById('sayNoBtn');
    const history = document.getElementById('history');
    const counter = document.getElementById('counter');
    const emoji = document.getElementById('emoji');

    const fallbacks = [
      "I'd love to, but I have a very important meeting with my couch.",
      "Sorry, my cat specifically requested I stay home today.",
      "I can't — I'm teaching my goldfish to swim backwards.",
      "I would, but I just found out I'm allergic to plans.",
      "My horoscope said to avoid commitments today.",
      "I promised myself I'd do absolutely nothing, and I'm a person of my word.",
      "I have to return some videotapes.",
      "I'm on a strict no-fun diet this week.",
      "My plants need emotional support right now.",
      "I can't, I'm currently in a very committed relationship with my bed.",
      "I'd say yes, but my schedule is booked with overthinking.",
      "Sorry, I'm busy rearranging my sock drawer by color and thread count.",
      "I have a prior engagement with a pizza and a streaming service.",
      "My imaginary friend needs me today.",
      "I can't — Mercury is in retrograde and I'm not taking any chances."
    ];

    let dodgeCount = parseInt(localStorage.getItem('dodgeCount') || '0', 10);
    updateCounter();

    function updateCounter() {
      if (dodgeCount > 0) {
        counter.textContent = `You've dodged ${dodgeCount} thing${dodgeCount === 1 ? '' : 's'} so far 🎯`;
        counter.classList.add('visible');
      }
    }

    function createCard(text, isError) {
      const card = document.createElement('div');
      card.className = 'excuse-card' + (isError ? ' error' : '');

      const reason = document.createElement('div');
      reason.className = 'reason';
      reason.textContent = text;

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '📋';
      copyBtn.title = 'Copy to clipboard';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = '✅';
          setTimeout(() => { copyBtn.textContent = '📋'; }, 1500);
        } catch {
          copyBtn.textContent = '❌';
          setTimeout(() => { copyBtn.textContent = '📋'; }, 1500);
        }
      });

      card.appendChild(reason);
      if (!isError) card.appendChild(copyBtn);

      history.prepend(card);
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '...';

      emoji.className = 'emoji thinking';
      emoji.textContent = '🤔';

      try {
        const res = await fetch('https://naas.isalman.dev/no');
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();

        createCard(data.reason, false);
        dodgeCount++;
        localStorage.setItem('dodgeCount', String(dodgeCount));
        updateCounter();
      } catch {
        const excuse = fallbacks[Math.floor(Math.random() * fallbacks.length)];
        createCard(excuse, false);
        dodgeCount++;
        localStorage.setItem('dodgeCount', String(dodgeCount));
        updateCounter();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Say No';
        emoji.className = 'emoji happy';
        emoji.textContent = '🤗';
      }
    });
  </script>
</body>
</html>
